<html>
    <head>
        <title>
            Marquee
        </title>
    </head>
    <body>
        <Marquee behavior="Alternate" scrollamount="100" direction="Right"> Welcome to Marquee</Marquee>
        <h3>Marquee Table</h3>
<table border="1" height="200px" width="50%">
    <tr>
        <td><img src="images/moon.jpg" height="100px" width="100px"></td>
        <td><Marquee behavior="scroll"  direction="down">Welcome</Marquee></td>
        <td><img src="images/moon.jpg" height="100px" width="100px"></td>
    </tr>
    <tr>
        <td><Marquee  behavior="scroll" direction="Right">Welcome</Marquee></td>
        <td><img src="images/moon.jpg" height="100px" width="100px"></td>
        <td><Marquee behavior="scroll" direction="Left">Welcome</Marquee></td>
    </tr>
    <tr>
        <td><img src="images/moon.jpg" height="100px" width="100px"></td>
        <td><Marquee behavior="scroll" direction="up">Welcome</Marquee></td>
        <td><img src="images/moon.jpg" height="100px" width="100px"></td>
    </tr>
</table>
    </body>
</html>
