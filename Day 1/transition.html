<html>

<head>
    <title>
        Transition
    </title>
    <style>
        #hello {
            border: 1px solid grey;
            border-radius: 5px;
            padding: 15px;
            margin-right: 20px;
            transition: 3s;
            border-width: 2px;

        }

        #welcome {
            border: 1px solid blue;
            border-radius: 5px;
            padding: 15px;
            background-color: blueviolet;
            transition:3s;
            border-width: 2px;

        }
        #hello:hover{
            background-color:chocolate;
            color:white;
            border:2px solid green;
        }
        #welcome:hover{
            background-color:chartreuse;
            
        }
    </style>
</head>

<body>
    <h2>Transition</h2>
    <div id="hy">
        <button id="hello">vanga welcome</button>
        <button id="welcome">ponga thanks</button>
    </div>

</body>

</html>
