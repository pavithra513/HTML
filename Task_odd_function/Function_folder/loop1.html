<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> for loop 1</title>
</head>

<body>
    <script>
        document.write("<h>Increment</h> <br></br>");
        for (let i = 1; i <= 10; i++) {
            document.write("value:" + i + "</br>");
        }

        document.write("<h>decrement</h> <br></br>");
        for (let i = 10; i >= 1; i--) {
            document.write("value:" + i + "</br>");
        }
        document.write("<h>decrement 100</h> <br></br>");
        for (let i = 100; i >= 1; i--) {
            document.write("value:" + i + "</br>");
        }


        document.write("<h> Name</h> <br></br>");
        for (let i = 1; i <= 10; i++) {

            document.write(i+".pavi <br></br>");
        }


        document.write("<h>increment  </h> <br></br>");
        let a=12;
        for (let i = 1; i <= 10; i++) {

            document.write(a+ "<br></br>");
        }







    </script>


</body>

</html>
