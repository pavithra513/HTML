<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>color change</title>
</head>
<body id="bx">
    <button  type="submit" onclick="red()">Red</button>
     <button  type="submit" onclick="green()">green</button>
      <button type="submit" onclick="blue()">blue</button>

      <script>
        function red(){
            document.getElementById("bx").style.backgroundColor="red";
           

        }
         function green(){
            document.getElementById("bx").style.backgroundColor="green";
            
        }
         function blue(){
            document.getElementById("bx").style.backgroundColor="blue";
            
        }
      </script>
    
</body>
</html>
