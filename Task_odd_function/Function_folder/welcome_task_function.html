<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>welcome Task</title>

<body>
    <div>
        <form action="">
            <label>Name</label><input type="text" id="name">

            }
