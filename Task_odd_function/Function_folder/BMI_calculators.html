<!DOCTYPE html>
<html>
<head>
    <title>BMI Calculator</title>
<link rel="stylesheet" href="BMI_calculators.css">
</head>

<body>

    <div class="bmi-box">

        <h1> BMI Calculator</h1>

        <label>Height (cm)</label>
        <input type="number" id="ip1">

        <label>Weight (kg)</label>
        <input type="number" id="ip2">

        <br>

        <button type="button" onclick="BMI()">Calculate BMI</button>

        <h1 id="h1"></h1>

    </div>


    <script>

        function BMI() {

            let height = document.getElementById("ip1").value;
            let weight = document.getElementById("ip2").value;

            let height1 = height / 100;

            let bmi = weight / (height1 * height1);

            if (bmi < 18.5) {

                document.getElementById("h1").innerText =
                    "BMI value: " + bmi + " Underweight";

            }

            else if (bmi >= 18.5 && bmi < 25) {

                document.getElementById("h1").innerText =
                    "BMI value: " + bmi + " Normal";

            }

            else if (bmi >= 25 && bmi < 30) {

                document.getElementById("h1").innerText =
                    "BMI value: " + bmi + " Overweight";

            }

            else {

                document.getElementById("h1").innerText =
                    "BMI value: " + bmi + " Obese";

            }

        }

    </script>

</body>
</html>
