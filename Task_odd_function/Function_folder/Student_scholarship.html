<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>scholorship</title>
</head>
<body>
    <div>
        <form>
           <label>Marks</label> <input type="number" id="mark"><br>
            <input type="submit" onclick="scholar()">
        </form>
    </div>
    <script>
        function scholar(){
            let marks=document.getElementById("mark").value;
            if(marks>=90){
                document.write("10000 scholarship");
            }
            else if(marks>=80){
                document.write("5000 scholarship");
            }
            else if(marks>=70){
                document.write("2000 scholarship");
            }
            else{
                document.write("No scholarship");
            }

        }
    </script>

    
</body>
</html>
