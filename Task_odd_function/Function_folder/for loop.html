<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for loop</title>
</head>
<body>
    <h1>For loop</h1>
    <div class="box">
        <div id="ip1">
            <label>Number</label>
            <input type="number" id="ip">
            
            <button type="submit" onclick="loop()">Display</button>
            <p id="p1"></p>
           

        </div>

    </div>
<script>
    function loop(){
       
        let a=Number(document.getElementById("ip").value);
        for(let i=1; i<=10; i++){
            
            document.write(a+" * "+i+" = "+(a*i)+"<br>");
        }
    }

</script>
    
</body>
</html>
