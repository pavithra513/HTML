<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bank</title>
</head>

<body>
    <div>
        <form>
            <label>Age</label><input type="number" id="age"><br>
            <label>Salary</label><input type="number" id="salary"><br>
            <input type="submit" onclick="bank()"> 
        </form>
    </div>
    <script>
        function bank() {
            let age = document.getElementById("age").value;
            let salary = document.getElementById("salary").value;
            if (age >= 21 && salary >= 25000) {
                document.write("eligible");
            }
            else {
                document.write("Rejected");
            }

        }
    </script>



</body>

</html>
