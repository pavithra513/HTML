        let result = "";
        let count = 0;

        for (let i = 111; i <= 130; i++) {
            let num = i;
            let rev = 0;

            while (num > 0) {
                let digit = num % 10;
                rev = rev * 10 + digit;
                num = Math.floor(num / 10);
            }

            if (i == rev) {
                result = result + i + " ";
                count++;
            }
        }

        document.getElementById("result").innerHTML = result;
        document.getElementById("count").innerHTML = "Count: " + count;
