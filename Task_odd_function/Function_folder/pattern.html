<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pattern</title>
</head>
<body>
    <script>
        document.write("<h1>pattern</h1>");
        for(let i=1;i<=3;i++){
            for(j=1;j<=4;j++){
                document.write(i)
            }
            document.write("</br>");
        }

           document.write("</br>");


        for(let i=1;i<=3;i++){
            for(j=1;j<=4;j++){
                document.write(j)
            }
            document.write("</br>");
        }

           document.write("</br>");


        for(let i=1;i<=3;i++){
            for(j=1;j<=4;j++){
                document.write("*")
            }
            document.write("</br>");
        }
    </script>
    
</body>
</html>
