<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>positive</title>
</head>
<body>
    <h1>positive & negative</h1>
    <label>Number</label>
    <input  type="number" id="input" ><br/>
    <h2 id="pos"></h2>
    <button type="submit" onclick="positive()">click me</button>
    <script>
        function positive(){
            let number=document.getElementById("input").value;
            if(number>0){
                document.getElementById("pos").innerText="the value is : "+number+"positive";
            }
            else if(number<0){
                 document.getElementById("pos").innerText="the value is : "+number+"negative";

            }
            else{
                 document.getElementById("pos").innerText="the value is : "+number+"invalid";
            }

        }

        
    </script>
    
</body>
</html>
