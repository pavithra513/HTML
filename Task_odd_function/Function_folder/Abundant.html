<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abundant</title>
</head>

<body>
    <script>
        let sum = 0;
        let n = 6;
        for (let i = 1; i < n; i++) {
            if (n % i == 0) {
                sum = sum + i;

            }


        }

        if (sum > n) {
            document.write(n + " is a Abundant");
        }
        else {
            document.write(n + " is  not a Abundant number");
        }
    </script>

</body>

</html>
