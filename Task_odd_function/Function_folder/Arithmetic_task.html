<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic Task</title>
</head>

<body>
    <h1>Arithmetic Task</h1>
    <label>Num1</label>
    <input type="number" id="n1">
    <label>Num2</label>
    <input type="number" id="n2">
    <p id="result"></p>
    <button type="submit" onclick="add()">Add</button>
    <button type="submit" onclick="sub()">Sub</button>
    <button type="submit" onclick="mul()">Mul</button>
    <button type="submit" onclick="div()">Div</button>

    <script>
        function add() {
            let num1 = Number(document.getElementById("n1").value);
            let num2 = Number(document.getElementById("n2").value);
            let final = num1 + num2;
            document.getElementById("result").innerText = "res:" + final;
        }
         function sub() {
            let num1 = Number(document.getElementById("n1").value);
            let num2 = Number(document.getElementById("n2").value);
            let final = num1 - num2;
            document.getElementById("result").innerText = "res:" + final;
        } function mul() {
            let num1 = Number(document.getElementById("n1").value);
            let num2 = Number(document.getElementById("n2").value);
            let final = num1 * num2;
            document.getElementById("result").innerText = "res:" + final;
        } function div() {
            let num1 = Number(document.getElementById("n1").value);
            let num2 = Number(document.getElementById("n2").value);
            let final = num1 / num2;
            document.getElementById("result").innerText = "result:" + final;
        }
    </script>


</body>

</html>
