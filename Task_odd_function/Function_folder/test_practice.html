<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prime number</title>
</head>

<body>
    <script>
     for (let x = 1; x <= 20; x++) {
    let n = x;
    let count = 0;

    for (let i = 1; i <= n; i++) {
        if (n % i == 0) {
            count++;
        }
    }

    if (count == 2) {
        document.write("Prime number = " + n + "<br>");
    }
}

let num = -1507;
let temp = num;


if (temp > 0) {
    document.write(temp + " = positive<br>");
}
else if (temp < 0) {
    document.write(temp + " = negative<br>");
}
else {
    document.write(temp + " = neutral<br>");
}


num = Math.abs(num);

while (num > 0) {
    let rem = num % 10;
    num = parseInt(num / 10);

    if (rem > 0) {
        document.write(rem + " = positive<br>");
    }
    else if (rem < 0) {
        document.write(rem + " = negative<br>");
    }
    else {
        document.write(rem + " = neutral<br>");
    }
}

    </script>

</body>

</html>
