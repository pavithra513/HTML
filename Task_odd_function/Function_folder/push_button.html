<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Push button</title>
</head>
<body>
    <input type="text" id="ip1" placeholder="enter value">
    <button type="submit" onclick="Add()">ADD</button>
    <button type="submit" onclick="remove()">Remove</button>

    <p id="p1"></p>

    <script>
       
        let arr=[];
        function Add(){
             let name=document.getElementById("ip1").value;
           
            arr.push(name);
              document.getElementById("p1").innerText=arr;
           
        }
        function remove(){
             let name=document.getElementById("ip1").value;
             let fint=arr.indexOf(name);
             if(fint!=-1){
                arr.splice(fint,1);
             }
             
             document.getElementById("p1").innerText=arr;

             }

</body>
