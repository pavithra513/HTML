<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration form</title>
</head>

<body>
    <h1>Student Registration Form</h1>
    <form action="" method="">
        <table cellspacing="15" cellpadding="15">
            <tr>
                <th>Name</th>
                <td>
                    <input type="text">
                </td>
            </tr>
            <tr>
                <th>Email</th>
                <td>
                    <input type="email">
                </td>

            </tr>
            <tr>
                <th>Mobile</th>
                <td>
                    <input type="text">
                </td>
            </tr>
            <tr>
                <th>Gender</th>
                <td>
                    <input type="radio">Male
                    <input type="radio">Female
                </td>
            </tr>
            <tr>
                <th>Course</th>
                <td><select>
                    <option>Select course</option>
                    <option>Java</option>
                    <option>
                        python
                    </option>
                    <option>AIML</option>
                </select></td>

            </tr>
            <tr>
                <th>submit</th>
                <td><input type="submit"></td>
            </tr>
            <tr>
                <th>reset</th>
                <td><input type="reset"></td>
            </tr>
        </table>

    </form>

</body>

</html>
