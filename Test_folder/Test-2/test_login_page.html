<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <style>
        body {
            background-color: lightblue;
           display:flex;
           flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .one {
            background-color: aquamarine;
            border: 2px solid black;
            width: 300px;
            padding: 20px;
            border-radius: 10px;



        }

        .h2 {
            color: cadetblue;
            align-items: center;
        }

        .form {
            background-color:violet;

            border-radius: 10px;
            padding: 20px;

        }

        .input {
            padding: 10px;
            margin: 8px;
            width: 50%;

        }

        .button {
            color: black;
            background-color: antiquewhite;
            padding: 10px;
            margin: 10px;
        }

        .button:hover {
            color: black;
            background-color: aquamarine;

        }
    </style>
</head>

<body>
    <h2 class="h2">Login page</h2>
    <div class="one">
        <form class="form">
            <input class="input" type="text" placeholder="enter name"><br>
            <input class="input" type="email" placeholder="enter email"><br>
            <input class="input" type="text" placeholder="enter mobile"><br>
            <input class="input" type="password" placeholder="enter password"><br>
            <input class="button" type="submit" value="login">
            <input class="button" type="reset" value="reset">
        </form>
    </div>

</body>

</html>
