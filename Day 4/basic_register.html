<html>

<head>
    <title>
        Basic Register
    </title>
</head>

<body>
    <form method="get">
        <table border="1" cellpadding="10" bgcolor="Aqua">
            <tr>
                <th>Name</th>
                <td><input type="text"></td>
            </tr>
            <tr>
                <th>Education qualification</th>
                <td><input type="checkbox">UG
                    <input type="checkbox">PG
                    <input type="checkbox">phd

                </td>
            </tr>
            <tr>
                <th>Gender</th>
                <td><input type="Radio">Male
                    <input type="Radio">Female
                </td>
            </tr>
            <tr>
                <th>DOB</th>
                <td><input type="date"></td>
            </tr>
            <tr>
                <th>Age</th>
                <td><input type="number"></td>
            </tr>
            <tr>
                <th>Resume</th>
                <td><input type="file"></td>
            </tr>
            <tr>
                <th><input type="Reset" value="clear"></th>
                <td><input type="submit" value="Register"></td>
            </tr>
        </table>
    </form>
</body>

</html>
